[package]
name = "kodework-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kodework_tauri"
path = "src/lib.rs"

[dependencies]
kodework-core = { path = "../crates/kodework-core" }
kodework-herdr = { path = "../crates/kodework-herdr" }
kodework-local-pty = { path = "../crates/kodework-local-pty" }
kodework-domain = { path = "../crates/kodework-domain" }
kodework-network = { path = "../crates/kodework-network" }
kodework-platform = { package = "kodework-platform-win", path = "../crates/kodework-platform-win" }
kodework-secrets = { path = "../crates/kodework-secrets" }
kodework-sftp = { path = "../crates/kodework-sftp" }
kodework-ssh = { path = "../crates/kodework-ssh" }
kodework-storage = { path = "../crates/kodework-storage" }
kodework-tailscale = { path = "../crates/kodework-tailscale" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tauri-plugin-updater = "2.10.1"
zeroize = "1"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[target.'cfg(windows)'.dependencies]
kodework-secrets-win = { path = "../crates/kodework-secrets-win" }

[target.'cfg(not(windows))'.dependencies]
kodework-secrets-native = { path = "../crates/kodework-secrets-native" }

[lints]
workspace = true
