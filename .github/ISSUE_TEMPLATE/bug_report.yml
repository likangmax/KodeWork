name: Bug report
description: Report a reproducible problem without including secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿填写密码、Tailscale auth key、SSH 私钥、真实主机名或私人文件内容。"
  - type: input
    id: version
    attributes:
      label: Kodework version
      placeholder: "0.2.2"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
