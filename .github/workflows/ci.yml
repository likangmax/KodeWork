name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Prepare bundled Tailscale sidecars
        shell: pwsh
        run: ./scripts/prepare-tailscale.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # This job intentionally checks the portable Rust graph without claiming
  # that a Windows shell build proves a macOS/Linux desktop release.  Native
  # bundle/signing jobs belong in the release workflow and run on the target
  # operating system.
  portable-rust:
    name: portable Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check portable crates
        shell: bash
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
      - name: Test portable crates
        run: >-
          cargo test --locked
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
