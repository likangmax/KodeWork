name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new commit on the same PR supersedes the older CI result. Keep main push
# runs independent so every merged commit still receives its own validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run check:versions
      - run: npm run test:frontend
      - run: node --test scripts/verify-updater-signature.test.mjs
      - run: node --test scripts/check-tauri-versions.test.mjs
      - run: npm run build

  windows-rust:
    name: Windows Rust
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Resolve Go cache locations
        id: go-cache
        shell: pwsh
        run: |
          "version=$((& go env GOVERSION).Trim())" >> $env:GITHUB_OUTPUT
          "mod=$((& go env GOMODCACHE).Trim())" >> $env:GITHUB_OUTPUT
          "build=$((& go env GOCACHE).Trim())" >> $env:GITHUB_OUTPUT
      # Cache only Go's content-addressed module/build data. The generated
      # sidecars themselves are never cached: the preparation script still
      # verifies the pinned upstream revision, rebuilds, and smoke-tests them.
      - name: Restore Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: tailscale-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('scripts/prepare-tailscale.ps1') }}
          restore-keys: |
            tailscale-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-
      - name: Prepare bundled Tailscale sidecars
        shell: pwsh
        run: ./scripts/prepare-tailscale.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Repeat native PowerShell ConPTY readiness smoke test
        shell: pwsh
        run: |
          # Catch flaky startup/handshake failures without hiding a failed attempt.
          foreach ($attempt in 1..2) {
            Write-Host "PowerShell ConPTY readiness repeat $attempt/2"
            cargo test --locked -p kodework-local-pty --lib tests::powershell_round_trip_uses_real_conpty -- --exact
            if ($LASTEXITCODE -ne 0) { throw "ConPTY readiness repeat $attempt failed." }
          }

  # Everything else validates the workspace in the debug profile or builds only
  # the frontend, so a release-profile or Tauri crate/npm regression could reach
  # main with every context green (that is exactly what happened before #85: all
  # six contexts passed while `tauri build` refused to run). This runs as its own
  # job so it is validated in parallel and does not extend the critical path.
  # --no-bundle keeps signing material out of pull requests; it still exercises
  # the CLI version preflight, codegen, the frontend build and the release link.
  # Measured: ~2.5 min for a cold release profile locally, so expect 4-5 min.
  desktop-build:
    name: Desktop build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0
      - name: Resolve Go cache locations
        id: go-cache
        shell: pwsh
        run: |
          "version=$((& go env GOVERSION).Trim())" >> $env:GITHUB_OUTPUT
          "mod=$((& go env GOMODCACHE).Trim())" >> $env:GITHUB_OUTPUT
          "build=$((& go env GOCACHE).Trim())" >> $env:GITHUB_OUTPUT
      - name: Restore Go module and build caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: tailscale-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('scripts/prepare-tailscale.ps1') }}
          restore-keys: |
            tailscale-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-
      - name: Prepare bundled Tailscale sidecars
        shell: pwsh
        run: ./scripts/prepare-tailscale.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify the desktop build (no installer)
        run: npx tauri build --no-bundle

  dependency-security:
    name: Dependency and secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Audit production frontend dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - name: Audit Rust dependencies with RustSec
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      # Cargo.lock is target-independent, so an advisory against a Linux-only
      # crate is reported even though the Windows artifact never links it. This
      # proves that mechanically - and proves the check itself still works by
      # requiring the same crates to be present for the Linux target - instead of
      # leaving a standing alert with only a prose justification.
      - name: Prove no Linux-desktop advisory crate is shipped
        run: npm run check:shipped-graph
      - name: Reject obvious generated secrets
        shell: bash
        run: |
          if git grep -nI -E '(^|[^A-Za-z])(tskey-[A-Za-z0-9]|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})([^A-Za-z]|$)' -- ':!tests/fixtures/**'; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi

  # `rust` is already a required status context on main. Keep that stable while
  # making it an aggregate gate so Windows Rust, dependency/security policy and
  # the desktop build must all succeed even when repository-admin settings cannot
  # be changed.
  rust:
    name: rust
    needs: [windows-rust, dependency-security, desktop-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce Rust and security gates
        shell: bash
        env:
          WINDOWS_RUST_RESULT: ${{ needs.windows-rust.result }}
          DEPENDENCY_SECURITY_RESULT: ${{ needs.dependency-security.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
        run: |
          if [ "$WINDOWS_RUST_RESULT" != "success" ]; then
            echo "Windows Rust result: $WINDOWS_RUST_RESULT" >&2
            exit 1
          fi
          if [ "$DEPENDENCY_SECURITY_RESULT" != "success" ]; then
            echo "Dependency/security result: $DEPENDENCY_SECURITY_RESULT" >&2
            exit 1
          fi
          if [ "$DESKTOP_BUILD_RESULT" != "success" ]; then
            echo "Desktop build result: $DESKTOP_BUILD_RESULT" >&2
            exit 1
          fi

  # This job intentionally checks the portable Rust graph without claiming
  # that a Windows shell build proves a macOS/Linux desktop release. Native
  # bundle/signing jobs belong in the release workflow and run on the target
  # operating system.
  # Everything else that exercises SSH uses the in-process fake server in
  # kodework-testkit, which shares this workspace's crate versions and never
  # leaves the process. This job starts a real OpenSSH server on the runner so the
  # client meets a real banner, real key exchange, real `authorized_keys`
  # authentication, the real `sftp` subsystem and a real shell.
  real-ssh:
    name: Real SSH server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0
      - name: Start a real sshd for the tests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          key="${RUNNER_TEMP}/real-ssh-key"
          ssh-keygen -t ed25519 -N '' -f "$key" -q
          # A dedicated account, because sshd refuses key authentication for a
          # locked account and the runner's own account is locked. Its password is
          # random and password authentication stays off, so only the key works.
          sudo useradd -m -s /bin/bash kdtest
          echo "kdtest:$(openssl rand -hex 24)" | sudo chpasswd
          sudo mkdir -p /home/kdtest/.ssh
          sudo cp "${key}.pub" /home/kdtest/.ssh/authorized_keys
          sudo chown -R kdtest:kdtest /home/kdtest/.ssh
          sudo chmod 700 /home/kdtest/.ssh
          sudo chmod 600 /home/kdtest/.ssh/authorized_keys
          sudo mkdir -p /tmp/kodework-real-ssh
          sudo chown kdtest:kdtest /tmp/kodework-real-ssh
          # A dedicated port keeps this independent of any sshd the image ships.
          sudo /usr/sbin/sshd -p 2222 -o 'PasswordAuthentication=no' -o 'PubkeyAuthentication=yes' -o 'UsePAM=no'
          for _ in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then exec 3<&-; break; fi
            sleep 0.5
          done
          echo "sshd is listening on 2222"
          {
            echo "KODEWORK_TEST_SSH_HOST=127.0.0.1"
            echo "KODEWORK_TEST_SSH_PORT=2222"
            echo "KODEWORK_TEST_SSH_USER=kdtest"
            echo "KODEWORK_TEST_SSH_KEY=${key}"
            echo "KODEWORK_TEST_SSH_DIR=/tmp/kodework-real-ssh"
          } >> "$GITHUB_ENV"
      # A key-only sshd fails for reasons that only the server log explains (a locked
      # account, or file modes sshd refuses), so prove the path works before blaming
      # the client.
      - name: Prove the key authenticates before running the client
        run: |
          set -euo pipefail
          ssh -i "${KODEWORK_TEST_SSH_KEY}" -p "${KODEWORK_TEST_SSH_PORT}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes \
            "${KODEWORK_TEST_SSH_USER}@${KODEWORK_TEST_SSH_HOST}" 'echo ssh-ok' || {
              sudo tail -n 40 /var/log/auth.log;
              exit 1;
            }
      - name: Run the client against the real server
        run: cargo test --locked -p kodework-ssh --test real_server -- --nocapture
      - name: Show the server log when the client fails
        if: failure()
        run: sudo tail -n 80 /var/log/auth.log || sudo journalctl -u ssh --no-pager | tail -n 80 || true

  portable-rust:
    name: portable Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Check portable crates
        shell: bash
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
      - name: Test portable crates
        run: >-
          cargo test --locked
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
