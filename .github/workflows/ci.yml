name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:frontend
      - run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Prepare bundled Tailscale sidecars
        shell: pwsh
        run: ./scripts/prepare-tailscale.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  dependency-security:
    name: Dependency and secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Audit production frontend dependencies
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - name: Audit Rust dependencies with RustSec
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Reject obvious generated secrets
        shell: bash
        run: |
          if git grep -nI -E '(^|[^A-Za-z])(tskey-[A-Za-z0-9]|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})([^A-Za-z]|$)' -- ':!tests/fixtures/**'; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi

  # This job intentionally checks the portable Rust graph without claiming
  # that a Windows shell build proves a macOS/Linux desktop release.  Native
  # bundle/signing jobs belong in the release workflow and run on the target
  # operating system.
  portable-rust:
    name: portable Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - name: Check portable crates
        shell: bash
        run: >-
          cargo check --locked --target "${{ matrix.target }}"
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
      - name: Test portable crates
        run: >-
          cargo test --locked
          -p kodework-domain
          -p kodework-core
          -p kodework-storage
          -p kodework-secrets
          -p kodework-secrets-native
          -p kodework-secrets-win
          -p kodework-network
          -p kodework-ssh
          -p kodework-sftp
          -p kodework-tailscale
          -p kodework-herdr
          -p kodework-local-pty
          -p kodework-testkit
