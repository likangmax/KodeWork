name: One-shot final maintenance integration

on:
  push:
    branches:
      - maintenance/release-0.2.4-a11y

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/release-0.2.4-a11y
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
      - name: Integrate reviewed dependency updates
        run: npm install --save-dev --save-prefix='^' vite@8.3.0 oxlint@1.82.0
      - name: Prepare 0.2.4 release candidate metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('Cargo.toml', '[workspace.package]\nversion = "0.2.3"', '[workspace.package]\nversion = "0.2.4"')
          replace_once('package.json', '  "version": "0.2.3",', '  "version": "0.2.4",')
          replace_once('src-tauri/tauri.conf.json', '  "version": "0.2.3",', '  "version": "0.2.4",')

          lock = Path('package-lock.json')
          text = lock.read_text(encoding='utf-8')
          old_top = '  "version": "0.2.3",'
          old_root = '      "version": "0.2.3",'
          if text.count(old_top) != 1 or text.count(old_root) != 1:
              raise SystemExit('package-lock.json: unexpected root version layout')
          text = text.replace(old_top, '  "version": "0.2.4",', 1)
          text = text.replace(old_root, '      "version": "0.2.4",', 1)
          lock.write_text(text, encoding='utf-8')

          cargo_lock = Path('Cargo.lock')
          original = cargo_lock.read_text(encoding='utf-8')
          parts = re.split(r'(?=\[\[package\]\]\n)', original)
          changed = []
          output = []
          for part in parts:
              if part.startswith('[[package]]') and '\nsource = ' not in part and 'version = "0.2.3"' in part:
                  name = re.search(r'\nname = "([^"]+)"', '\n' + part)
                  part = part.replace('version = "0.2.3"', 'version = "0.2.4"', 1)
                  changed.append(name.group(1) if name else '<unknown>')
              output.append(part)
          if len(changed) < 10:
              raise SystemExit(f'Cargo.lock: expected workspace package versions to change, changed only {changed}')
          cargo_lock.write_text(''.join(output), encoding='utf-8')
          print('Updated workspace lock packages:', ', '.join(changed))

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '# Changelog\n\n'
          if text.count(marker) != 1 or '## 0.2.4' in text:
              raise SystemExit('docs/CHANGELOG.md: unexpected header or existing 0.2.4 section')
          section = '''## 0.2.4 — Unreleased — Reliability, security, accessibility, and maintenance\n\n- Hardened Run lifecycle/reconciliation so transport or launcher success is never misreported as remote command success; unresolved outcomes remain explicit and reconcilable.\n- Strengthened SSH host-key trust ownership across direct, Tailscale, public-fallback, and jump-host paths, with fail-closed trust-store reads and native reconnect state propagation.\n- Hardened SFTP resume and transfer identity with prefix verification, destination leases, source revalidation, safe `~` expansion, and more reliable pause/resume/retry/cancel behavior.\n- Improved Windows ConPTY/native recovery and expanded locked full-workspace plus portable Linux/macOS core verification without claiming native macOS/Linux desktop releases.\n- Remediated `RUSTSEC-2026-0285` by updating rustls, and tightened dependency-audit, tracked-secret, release-lineage, updater-signature, and Authenticode publication gates.\n- Updated maintained tooling/dependencies including uuid 1.26.1, @vitejs/plugin-react 6.1.1, Vite 8.3.0, and oxlint 1.82.0; Node 26 type definitions and TypeScript 7 remain deferred to dedicated major migrations.\n- Added accessible names to every current modal dialog plus a regression test that prevents unnamed dialogs from returning.\n- Stable `v0.2.4` publication remains gated by the configured Tauri updater signing key and trusted Authenticode certificate; public updater hosting and native macOS/Linux bundles are still not claimed as released.\n\n'''
          changelog.write_text(text.replace(marker, marker + section, 1), encoding='utf-8')

          replace_once('.github/ISSUE_TEMPLATE/bug_report.yml', '      placeholder: "0.2.3"', '      placeholder: "x.y.z"')
          replace_once('.github/workflows/release.yml', '        description: Existing tag to package (for example v0.2.3)', '        description: Existing stable tag to package (vX.Y.Z)')
          PY
      - name: Verify release version consistency
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('/tmp/metadata.json').read_text())
          local = [p for p in metadata['packages'] if p.get('source') is None]
          versions = {p['version'] for p in local}
          if versions != {'0.2.4'}:
              raise SystemExit(f'workspace versions are not uniformly 0.2.4: {versions}')
          package = json.loads(Path('package.json').read_text())
          package_lock = json.loads(Path('package-lock.json').read_text())
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          if package['version'] != '0.2.4' or package_lock['version'] != '0.2.4' or package_lock['packages']['']['version'] != '0.2.4' or tauri['version'] != '0.2.4':
              raise SystemExit('frontend/Tauri version mismatch')
          if package['devDependencies']['vite'] != '^8.3.0' or package['devDependencies']['oxlint'] != '^1.82.0':
              raise SystemExit('dependency ranges do not match reviewed targets')
          PY
      - name: Validate final frontend combination
        run: |
          npm ci
          npm run lint
          npm run test:frontend
          npm run build
      - name: Commit product-only diff and self-delete workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-final-maintenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare 0.2.4 maintenance candidate"
          git push origin HEAD:maintenance/release-0.2.4-a11y
