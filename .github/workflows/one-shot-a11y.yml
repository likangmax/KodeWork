name: One-shot dialog accessibility fix

on:
  push:
    branches:
      - maintenance/release-0.2.4-a11y

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: maintenance/release-0.2.4-a11y
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply fail-closed accessibility edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = 'src/App.tsx'
          edits = [
              ('{promptPassword && selected && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{promptPassword && selected && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="password-dialog-title">'),
              ('<div><div className="eyebrow">AUTHENTICATION</div><h2>{t(\'connectTo\', selected.label)}</h2></div>', '<div><div className="eyebrow">AUTHENTICATION</div><h2 id="password-dialog-title">{t(\'connectTo\', selected.label)}</h2></div>'),
              ('{projectDraft && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{projectDraft && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">'),
              ('<div><div className="eyebrow">PROJECT</div><h2>{t(\'editProject\')}</h2></div>', '<div><div className="eyebrow">PROJECT</div><h2 id="project-dialog-title">{t(\'editProject\')}</h2></div>'),
              ('{actionDraft && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{actionDraft && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="action-dialog-title">'),
              ('<div><div className="eyebrow">ACTION</div><h2>{t(\'editAction\')}</h2></div>', '<div><div className="eyebrow">ACTION</div><h2 id="action-dialog-title">{t(\'editAction\')}</h2></div>'),
              ('{confirmAction && selected && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{confirmAction && selected && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="confirm-action-dialog-title">'),
              ('<div><div className="eyebrow">CONFIRM</div><h2>{t(\'confirmRunAction\')}</h2></div>', '<div><div className="eyebrow">CONFIRM</div><h2 id="confirm-action-dialog-title">{t(\'confirmRunAction\')}</h2></div>'),
              ('{snippetsOpen && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{snippetsOpen && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="snippets-dialog-title">'),
              ('<div><div className="eyebrow">SNIPPETS</div><h2>{t(\'commandSnippets\')}</h2></div>', '<div><div className="eyebrow">SNIPPETS</div><h2 id="snippets-dialog-title">{t(\'commandSnippets\')}</h2></div>'),
              ('{tunnelPanelOpen && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{tunnelPanelOpen && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="tunnels-dialog-title">'),
              ('<div><div className="eyebrow">PORT FORWARDING</div><h2>{t(\'sshTunnels\')}</h2></div>', '<div><div className="eyebrow">PORT FORWARDING</div><h2 id="tunnels-dialog-title">{t(\'sshTunnels\')}</h2></div>'),
              ('{keyboardInteractiveRequest && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{keyboardInteractiveRequest && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="keyboard-interactive-dialog-title">'),
              ('<div><div className="eyebrow">KEYBOARD-INTERACTIVE</div><h2>{keyboardInteractiveRequest.name || t(\'serverAuth\')}</h2></div>', '<div><div className="eyebrow">KEYBOARD-INTERACTIVE</div><h2 id="keyboard-interactive-dialog-title">{keyboardInteractiveRequest.name || t(\'serverAuth\')}</h2></div>'),
              ('{hostKeyRequest && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true">', '{hostKeyRequest && (\n        <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="host-key-dialog-title">'),
              ('<div><div className="eyebrow">HOST KEY VERIFICATION</div><h2>{t(\'confirmHostKey\')}</h2></div>', '<div><div className="eyebrow">HOST KEY VERIFICATION</div><h2 id="host-key-dialog-title">{t(\'confirmHostKey\')}</h2></div>'),
          ]
          for old, new in edits:
              replace_once(app, old, new)

          host = 'src/settings/HostEditor.tsx'
          replace_once(host,
              'return <div className="modal-backdrop" role="dialog" aria-modal="true"><form className="host-modal host-editor"',
              'return <div className="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="host-editor-title"><form className="host-modal host-editor"')
          replace_once(host, '<h2>{labels.title}</h2>', '<h2 id="host-editor-title">{labels.title}</h2>')

          test = Path('src/dialog-accessibility.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst sources = [\n  './App.tsx',\n  './settings/HostEditor.tsx',\n  './settings/SettingsPanel.tsx',\n  './settings/LanguagePrompt.tsx',\n]\n\ndescribe('dialog accessibility contract', () => {\n  it('gives every modal dialog an accessible name', () => {\n    let dialogCount = 0\n    for (const relativePath of sources) {\n      const source = readFileSync(new URL(relativePath, import.meta.url), 'utf8')\n      const dialogs = source.match(/<div[^>]*role=\\\"dialog\\\"[^>]*>/g) ?? []\n      dialogCount += dialogs.length\n      for (const dialog of dialogs) {\n        const labelledBy = dialog.match(/aria-labelledby=\\\"([^\\\"]+)\\\"/)\n        const directLabel = dialog.match(/aria-label=\\\"([^\\\"]+)\\\"/)\n        expect(labelledBy || directLabel, `${relativePath}: ${dialog}`).toBeTruthy()\n        if (labelledBy) expect(source).toContain(`id=\\\"${labelledBy[1]}\\\"`)\n      }\n    }\n    expect(dialogCount).toBeGreaterThan(0)\n  })\n})\n""", encoding='utf-8')
          PY
      - name: Validate frontend
        run: |
          npm ci
          npm run lint
          npm run test:frontend
          npm run build
      - name: Commit product-only diff and self-delete workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-a11y.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: name modal dialogs for assistive technology"
          git push origin HEAD:maintenance/release-0.2.4-a11y
