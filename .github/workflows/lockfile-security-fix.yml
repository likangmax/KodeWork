name: One-shot rustls lockfile security update

on:
  push:
    branches:
      - chore/oss-maintainer-experience
    paths:
      - .github/workflows/lockfile-security-fix.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/oss-maintainer-experience
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0
      - name: Update only the vulnerable rustls lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo update -p rustls@0.23.43 --precise 0.23.45
          python - <<'PY'
          from pathlib import Path
          import re

          before = Path(__import__('os').environ['RUNNER_TEMP']) / 'Cargo.lock.before'
          before_text = before.read_text()
          after_text = Path('Cargo.lock').read_text()

          pattern = re.compile(
              r'(?ms)^\[\[package\]\]\nname = "rustls"\nversion = "0\.23\.43"\n'
              r'source = "registry\+https://github\.com/rust-lang/crates\.io-index"\n'
              r'checksum = "0283386ce02abc0151e1761d08802dfe86c173b0b494af5cbc086574e453da06"\n'
          )
          matches = list(pattern.finditer(before_text))
          if len(matches) != 1:
              raise SystemExit(f'Expected one exact vulnerable rustls block header, found {len(matches)}')

          replacement = (
              '[[package]]\n'
              'name = "rustls"\n'
              'version = "0.23.45"\n'
              'source = "registry+https://github.com/rust-lang/crates.io-index"\n'
              'checksum = "0d41d731c7d2f962d1ccc364cec258de3c0e93b38c2fb3ba97ac74513048d634"\n'
          )
          expected = pattern.sub(replacement, before_text, count=1)
          if after_text != expected:
              raise SystemExit('cargo update changed more than the expected rustls version/checksum lines; refusing to commit')
          PY
          git diff --check
      - name: Commit the verified lockfile update and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lockfile-security-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/lockfile-security-fix.yml
          git diff --cached --check
          git commit -m 'security: update rustls for RUSTSEC-2026-0285'
          git push origin HEAD:chore/oss-maintainer-experience
