name: One-shot changelog history cleanup

on:
  push:
    branches:
      - docs/cross-platform-roadmap-truth
    paths:
      - .github/workflows/changelog-history-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/cross-platform-roadmap-truth
          fetch-depth: 0
      - name: Relabel stale unreleased snapshots exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '## [Unreleased] — 2026-08-16 — 成品候选收口':
                  '## Historical development snapshot — 2026-08-16 — 成品候选收口',
              '## [Unreleased] — 2026-08-15 — Codex 深度审计第一阶段':
                  '## Historical development snapshot — 2026-08-15 — Codex 深度审计第一阶段',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)
          if '[Unreleased]' in text:
              raise SystemExit('Unexpected additional [Unreleased] marker remains; review manually')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "docs/CHANGELOG.md" ]; then
            echo "Unexpected files changed:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit verified cleanup and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/changelog-history-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHANGELOG.md .github/workflows/changelog-history-cleanup.yml
          git diff --cached --check
          git commit -m 'docs: relabel stale unreleased changelog snapshots'
          git push origin HEAD:docs/cross-platform-roadmap-truth
