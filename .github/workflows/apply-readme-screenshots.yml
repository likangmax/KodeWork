name: Apply README product screenshots

on:
  push:
    branches: [docs/readme-product-screenshots]
    paths:
      - .github/workflows/apply-readme-screenshots.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Insert verified screenshots into both READMEs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          english = Path('README.md')
          text = english.read_text(encoding='utf-8')
          marker = '\n## Quick start\n'
          block = r'''
          ## Product tour

          These captures are rendered from the current KodeWork UI using documentation-only synthetic data. The visible account, file names, paths, terminal output, and `192.0.2.0/24` / `198.51.100.0/24` TEST-NET addresses are examples only; no real host, tailnet, credential, or private session data is shown.

          <table>
            <tr>
              <td width="50%"><img src="docs/assets/readme/workspace-terminal.png" alt="KodeWork connected workspace showing a synthetic remote terminal session"></td>
              <td width="50%"><img src="docs/assets/readme/files-transfers.png" alt="KodeWork SFTP files view showing synthetic project files and an in-progress transfer"></td>
            </tr>
          </table>

          <p align="center">
            <img src="docs/assets/readme/workstation-config.png" width="620" alt="KodeWork workstation configuration showing a synthetic testuser account and TEST-NET addresses">
          </p>
          '''.strip() + '\n'
          if '## Product tour' not in text:
              if marker not in text:
                  raise SystemExit('English Quick start marker not found')
              text = text.replace(marker, '\n\n' + block + marker, 1)
              english.write_text(text, encoding='utf-8')

          chinese = Path('README.zh-CN.md')
          text = chinese.read_text(encoding='utf-8')
          marker = '\n## 快速开始\n'
          block = r'''
          ## 产品界面

          以下截图由当前 KodeWork 界面直接渲染，并使用仅供文档展示的合成数据。图中的账号、文件名、路径、终端输出以及 `192.0.2.0/24` / `198.51.100.0/24` TEST-NET 地址均为示例，不包含真实主机、tailnet、凭据或私人会话数据。

          <table>
            <tr>
              <td width="50%"><img src="docs/assets/readme/workspace-terminal.png" alt="KodeWork 已连接工作区，显示合成数据的远程终端会话"></td>
              <td width="50%"><img src="docs/assets/readme/files-transfers.png" alt="KodeWork SFTP 文件界面，显示合成项目文件和正在进行的传输"></td>
            </tr>
          </table>

          <p align="center">
            <img src="docs/assets/readme/workstation-config.png" width="620" alt="KodeWork 工作站配置界面，显示合成 testuser 账号和 TEST-NET 地址">
          </p>
          '''.strip() + '\n'
          if '## 产品界面' not in text:
              if marker not in text:
                  raise SystemExit('Chinese Quick start marker not found')
              text = text.replace(marker, '\n\n' + block + marker, 1)
              chinese.write_text(text, encoding='utf-8')
          PY
      - name: Commit README integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md
          git diff --cached --exit-code && exit 0
          git commit -m 'docs: showcase sanitized product screenshots'
          git push
