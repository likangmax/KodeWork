name: One-shot ConPTY test serialization fix

on:
  push:
    branches:
      - test/serialize-windows-conpty-tests
    paths:
      - .github/workflows/conpty-test-serialization-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/serialize-windows-conpty-tests
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0-x86_64-pc-windows-msvc
          components: rustfmt
      - name: Apply exact test-only serialization patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/kodework-local-pty/src/lib.rs')
          text = path.read_text()

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'mod tests {\n    use super::decode_wsl_distributions;\n',
              'mod tests {\n    use super::decode_wsl_distributions;\n\n'
              '    #[cfg(windows)]\n'
              '    static CONPTY_TEST_LOCK: tokio::sync::Mutex<()> = tokio::sync::Mutex::const_new(());\n',
              'test lock insertion',
          )

          text = replace_once(
              text,
              '    ) -> Result<(), String> {\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              '    ) -> Result<(), String> {\n'
              '        let _conpty_guard = CONPTY_TEST_LOCK.lock().await;\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              'round-trip lock acquisition',
          )

          text = replace_once(
              text,
              '    #[cfg(windows)]\n'
              '    #[test]\n'
              '    fn closed_terminal_rejects_io_and_resize() -> Result<(), super::LocalPtyError> {\n'
              '        if !super::command_exists("cmd.exe") {\n'
              '            return Ok(());\n'
              '        }\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              '    #[cfg(windows)]\n'
              '    #[tokio::test(flavor = "current_thread")]\n'
              '    async fn closed_terminal_rejects_io_and_resize() -> Result<(), super::LocalPtyError> {\n'
              '        if !super::command_exists("cmd.exe") {\n'
              '            return Ok(());\n'
              '        }\n'
              '        let _conpty_guard = CONPTY_TEST_LOCK.lock().await;\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              'closed-terminal test serialization',
          )

          text = replace_once(
              text,
              '    #[cfg(windows)]\n'
              '    #[test]\n'
              '    fn rapid_resize_is_bounded_and_session_limit_is_enforced() -> Result<(), super::LocalPtyError> {\n'
              '        if !super::command_exists("cmd.exe") {\n'
              '            return Ok(());\n'
              '        }\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              '    #[cfg(windows)]\n'
              '    #[tokio::test(flavor = "current_thread")]\n'
              '    async fn rapid_resize_is_bounded_and_session_limit_is_enforced() -> Result<(), super::LocalPtyError> {\n'
              '        if !super::command_exists("cmd.exe") {\n'
              '            return Ok(());\n'
              '        }\n'
              '        let _conpty_guard = CONPTY_TEST_LOCK.lock().await;\n'
              '        let manager = super::LocalTerminalManager::new();\n',
              'resize/session-limit test serialization',
          )

          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only)"
          if [ "$changed" != "crates/kodework-local-pty/src/lib.rs" ]; then
            echo "Unexpected files changed by patch/format:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
      - name: Exercise the real Windows ConPTY tests repeatedly
        shell: pwsh
        run: |
          cargo test --locked -p kodework-local-pty --lib --all-features
          cargo test --locked -p kodework-local-pty --lib --all-features
          cargo test --locked -p kodework-local-pty --lib --all-features
      - name: Commit verified test fix and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/conpty-test-serialization-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/kodework-local-pty/src/lib.rs .github/workflows/conpty-test-serialization-fix.yml
          git diff --cached --check
          git commit -m 'test: serialize real Windows ConPTY integration tests'
          git push origin HEAD:test/serialize-windows-conpty-tests
