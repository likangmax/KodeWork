name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (for example v0.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.98.0-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Prepare pinned Tailscale sidecars
        shell: pwsh
        run: ./scripts/prepare-tailscale.ps1
      - name: Install frontend dependencies
        run: npm ci
      - name: Build MSI and updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KODEWORK_CERT_THUMBPRINT: ${{ secrets.KODEWORK_CERT_THUMBPRINT }}
          KODEWORK_TIMESTAMP_URL: ${{ secrets.KODEWORK_TIMESTAMP_URL }}
          # Authenticode is an independent distributor-controlled trust layer;
          # updater signing below is mandatory for every stable release.
          KODEWORK_REQUIRE_AUTHENTICODE: '0'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for stable releases; refusing to publish unsigned updater artifacts.'
          }
          $keyDirectory = Join-Path $env:USERPROFILE '.tauri'
          New-Item -ItemType Directory -Path $keyDirectory -Force | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $keyDirectory 'kodework.key'),
            $env:TAURI_SIGNING_PRIVATE_KEY,
            [System.Text.UTF8Encoding]::new($false)
          )
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            [System.IO.File]::WriteAllText(
              (Join-Path $keyDirectory 'kodework.pass'),
              $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD,
              [System.Text.UTF8Encoding]::new($false)
            )
          }
          ./scripts/build-release.ps1
          $msi = Get-ChildItem target/release/bundle/msi -Filter '*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not generated.' }
          $sig = Get-Item ($msi.FullName + '.sig') -ErrorAction SilentlyContinue
          if (-not $sig) { throw 'Updater signature was not generated.' }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $staging = Join-Path $env:RUNNER_TEMP 'kodework-release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item $msi.FullName $staging
          Copy-Item $sig.FullName $staging
          "$hash *$($msi.Name)" | Set-Content -LiteralPath (Join-Path $staging ($msi.Name + '.sha256')) -Encoding utf8NoBOM
      - name: Upload immutable release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kodework-release-assets
          path: ${{ runner.temp }}/kodework-release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: windows-msi
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kodework-release-assets
          path: release-assets
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $msi = Get-ChildItem release-assets -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not generated.' }
          $sig = Get-Item ($msi.FullName + '.sig') -ErrorAction SilentlyContinue
          if (-not $sig) { throw 'Updater signature is missing from the release artifact.' }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $msi.DirectoryName ($msi.Name + '.sha256')
          if (-not (Test-Path -LiteralPath $checksumPath)) { throw 'SHA-256 manifest is missing from the release artifact.' }
          $expectedChecksum = "$hash *$($msi.Name)"
          if ((Get-Content -Raw -LiteralPath $checksumPath).Trim() -ne $expectedChecksum) { throw 'SHA-256 manifest does not match the MSI.' }
          $notes = @(
            "## KodeWork $env:RELEASE_TAG",
            '',
            'Windows x64 MSI for the KodeWork remote coding workbench.',
            '适用于 KodeWork 远程编码工作台的 Windows x64 安装包。',
            '',
            "SHA-256: $hash",
            '',
            'See the bilingual README for setup, security boundaries, and distribution notes.'
          ) -join "`n"
          $assets = @($msi.FullName, $checksumPath, $sig.FullName)
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingDir = Join-Path $env:RUNNER_TEMP 'existing-release'
            New-Item -ItemType Directory -Path $existingDir -Force | Out-Null
            foreach ($asset in $assets) {
              gh release download $env:RELEASE_TAG --pattern ([System.IO.Path]::GetFileName($asset)) --dir $existingDir 2>$null
              if ($LASTEXITCODE -ne 0) {
                throw "Release $env:RELEASE_TAG is missing asset $([System.IO.Path]::GetFileName($asset)); refusing partial mutation."
              }
              $existingPath = Join-Path $existingDir ([System.IO.Path]::GetFileName($asset))
              $actual = (Get-FileHash $existingPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $expected = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                throw "Release $env:RELEASE_TAG contains a different $([System.IO.Path]::GetFileName($asset)); refusing to overwrite an immutable release."
              }
            }
            Write-Host "Release $env:RELEASE_TAG is complete and byte-identical; no-op."
          } else {
            gh release create $env:RELEASE_TAG @assets --title "KodeWork $env:RELEASE_TAG" --notes $notes --verify-tag
          }
