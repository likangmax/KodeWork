[package]
name = "kodework-sftp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
kodework-domain = { path = "../kodework-domain" }
russh-sftp = { version = "2.4", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "io-util"] }

[dev-dependencies]
bytes = "1"
kodework-testkit = { path = "../kodework-testkit" }

[lints]
workspace = true