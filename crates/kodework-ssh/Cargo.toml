[package]
name = "kodework-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kodework-domain = { path = "../kodework-domain" }
# RSA private-key operations in the current RustCrypto stack are covered by
# RUSTSEC-2023-0071 with no patched release.  Kodework intentionally supports
# Ed25519/ECDSA keys and password authentication, but does not compile RSA key
# support until an upstream constant-time implementation is available.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2"] }
russh-sftp = { version = "2.4", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# `process` is required by the ProxyCommand transport in src/connection.rs.
# It was previously satisfied only by feature unification with
# kodework-agent/kodework-tailscale, so `cargo check -p kodework-ssh` (and
# therefore -p kodework-core) failed with "unresolved import tokio::process".
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "net", "process"] }
tokio-util = "0.7"
zeroize = "1"

[dev-dependencies]
rand = "0.10"
kodework-testkit = { path = "../kodework-testkit" }

[lints]
workspace = true
